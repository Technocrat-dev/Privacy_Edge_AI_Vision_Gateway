<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Edge-Vision Gateway</title>
    <style>
        body {
            background-color: #0d1117;
            color: #c9d1d9;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            margin: 0;
            display: flex;
            flex-direction: column;
            align-items: center;
            height: 100vh;
            overflow : hidden
        }
        .header {
            width: 100%;
            padding: 20px;
            background: #161b22;
            border-bottom: 1px solid #30363d;
            display: flex;
            justify-content: space-between;
            align-items: center;
            box-shadow: 0 4px 6px rgba(0,0,0,0.3);
        }
        .title {
            font-size: 1.5rem;
            font-weight: 600;
            margin-left: 20px;
        }
        .status-badge {
            background-color: #238636;
            color: white;
            padding: 5px 12px;
            border-radius: 20px;
            font-size: 0.9rem;
            font-weight: bold;
            margin-right: 20px;
            display: flex;
            align-items: center;
            gap: 8px;
        }
        .blink {
            width: 10px;
            height: 10px;
            background-color: #fff;
            border-radius: 50%;
            animation: blinker 1.5s linear infinite;
        }
        @keyframes blinker { 50% { opacity: 0; } }
        
        .main-container {
            flex-grow: 1;
            display: flex;
            justify-content: center;
            align-items: center;
            width: 100%;
            padding: 20px;
        }
        .video-feed {
            border: 2px solid #30363d;
            border-radius: 8px;
            box-shadow: 0 0 20px rgba(0,0,0,0.5);
            max-width: 90%;
            max-height: 80vh;
        }
        .footer {
            margin-bottom: 20px;
            font-size: 0.8rem;
            color: #8b949e;
        }
    </style>
</head>
<body>
    <div class="header">
        <div class="title">🛡️ Secure Edge-Vision Gateway</div>
        <div class="status-badge">
            <div class="blink"></div> SYSTEM ONLINE
        </div>
    </div>

    <div class="main-container">
        <img src="{{ url_for('video_feed') }}" class="video-feed" alt="Secure Stream">
    </div>

    <div class="footer">
        Powered by YOLOv11 & OpenVINO | Encryption: SHA-256
    </div>
</body>
</html>
